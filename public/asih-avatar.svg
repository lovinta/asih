<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="asih-mark-title">
  <title id="asih-mark-title">Asih, an AI helper (abstract mark)</title>
  <!--
    Asih mark, drawn by hand. Faceless and abstract on purpose: Asih is an AI, not a person.
    - Whole ring: calm and steady (asih = love and grace); no eyes or mouth, so it is not a face.
    - Small four-point spark on the ring: a common signal that this is an AI.
    - Deep blue tile, white ring: high contrast (white on #0B3B66 is about 11:1); no hearts, no cartoon shapes.
    TODO: a Muse Image (muse-image-1.0) version could replace this later, once Vinta has a Meta API key
    and approves the cost. Keep it faceless and not childish.
  -->
  <rect width="48" height="48" rx="12" fill="#0B3B66"/>
  <circle cx="22.5" cy="25.5" r="12" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="33.5" cy="14.5" r="7" fill="#0B3B66"/>
  <path d="M33.5 8.5 C34.1 12.2 35.8 13.9 39.5 14.5 C35.8 15.1 34.1 16.8 33.5 20.5 C32.9 16.8 31.2 15.1 27.5 14.5 C31.2 13.9 32.9 12.2 33.5 8.5 Z" fill="#FFD34D"/>
</svg>
